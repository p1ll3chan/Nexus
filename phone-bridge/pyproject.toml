[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-bridge"
version = "0.3.0a1"
description = "Nexus: Android notifications, calls, GPS and read-only remote Linux diagnostics over Tailscale + WebSocket"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["websockets>=13.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dbus = ["dbus-python>=1.3.2"]

[project.scripts]
phone-bridge = "main:main"
nexus = "main:main"

[tool.setuptools]
py-modules = [
    "authentication",
    "client",
    "config",
    "discovery",
    "main",
    "notifications",
    "protocol",
    "remote_dispatcher",
    "remote_ops",
    "remote_protocol",
    "remote_registry",
    "remote_store",
    "server",
    "storage",
    "web",
]
