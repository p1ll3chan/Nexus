# phone-bridge configuration
# Copy to ~/.config/phone-bridge/config.toml and edit the token.

# Bind to your Tailscale IP (see `tailscale ip -4`) so the agent is not reachable
# on other interfaces. 0.0.0.0 listens everywhere.
host = "0.0.0.0"
port = 8765

# Legacy shared secret for notifications/calls/GPS. Generate one with:
#     phone-bridge token
# The placeholder below is rejected at startup on purpose.
token = "change-me"

# Name this laptop advertises to the phone.
device_name = "arch-laptop"

# Optional Tailscale hostname/IP of the phone. Used for status logging only.
phone_name = "my-phone"

# auto | dbus | notify-send | console | none
notify_backend = "auto"
notification_timeout = 8000
notification_urgency = "normal"
default_icon = "phone"

# Only forward notifications from social media, messaging, communication, and email apps.
only_allowed_apps = true
allowed_apps = [
  "whatsapp", "com.whatsapp", "com.whatsapp.w4b",
  "telegram", "org.telegram.messenger",
  "signal", "org.thoughtcrime.securesms",
  "discord", "com.discord",
  "slack", "com.slack",
  "messages", "google messages", "sms", "com.google.android.apps.messaging",
  "messenger", "com.facebook.orca",
  "teams", "com.microsoft.teams",
  "google chat", "meet", "zoom", "skype", "viber", "line", "wechat", "element", "threema",
  "gmail", "com.google.android.gm",
  "outlook", "com.microsoft.office.outlook",
  "proton mail", "protonmail", "ch.protonmail.android",
  "thunderbird", "k-9 mail", "tuta", "yahoo mail", "spark", "fairemail", "bluemail", "fastmail", "email",
  "instagram", "com.instagram.android",
  "threads", "com.instagram.barcelona",
  "twitter", "x", "com.twitter.android",
  "reddit", "com.reddit.frontpage",
  "linkedin", "com.linkedin.android",
  "facebook", "com.facebook.katana",
  "snapchat", "com.snapchat.android",
  "mastodon", "bluesky",
  "phone", "dialer", "calls", "phonebridge"
]

# Apps that should never produce a desktop notification (case insensitive).
ignore_apps = []

# Suppress ongoing / persistent and low priority notifications.
ignore_ongoing = true
ignore_low_priority = true

allow_calls = true
allow_notifications = true
allow_location = true

# SQLite database path and retention window for GPS history.
db_path = "~/.local/share/phone-bridge/locations.db"
location_retention_days = 30

# Live Map UI server settings.
map_enabled = true
map_host = "127.0.0.1"
map_port = 8766

# Optional allow-list of device names. Empty means any authenticated device.
enabled_devices = []

heartbeat_interval = 25.0
heartbeat_timeout = 70.0
log_level = "INFO"

# --- Nexus Remote -----------------------------------------------------------
# Read-only Linux diagnostics (system status, process list/inspect) for devices
# paired with `phone-bridge remote pair <name> --grant remote.read`.
remote_enabled = true
remote_db_path = "~/.local/share/phone-bridge/nexus.db"
# Seconds before an authenticated device session must reconnect.
remote_session_max_age = 43200
# Seconds a Linux-side approval prompt stays valid (10-600).
remote_approval_ttl = 60
audit_retention_days = 90
# Shared-token login never grants remote access. Set legacy_token_auth = false
# (or an expiry date) once every phone uses a paired device credential.
legacy_token_auth = true
legacy_token_expires = ""

# Filesystems reported by system.status, by label (paths are never sent).
[remote_disks]
root = "/"
home = "~"

[icon_map]
whatsapp = "whatsapp"
telegram = "telegram"
signal = "signal-desktop"
discord = "discord"
messages = "org.gnome.Messages"
gmail = "org.gnome.Geary"
slack = "slack"
instagram = "instagram"
